# SQLite by default (a file on the volume). Set DATABASE_URL to a postgres://
# URL to use PostgreSQL instead — single database, Solid Queue tables included.
<% if ENV["DATABASE_URL"].present? %>
production:
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 16 } %>

test:
  url: <%= ENV["TEST_DATABASE_URL"] || ENV["DATABASE_URL"] %>
  pool: 5

development:
  url: <%= ENV["DATABASE_URL"] %>
  pool: 5
<% else %>
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  queue:
    <<: *default
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
<% end %>
