# One-command Flow: `docker compose up -d` behind your TLS proxy of choice.
#
#   1. echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" > .env
#      echo "FLOW_HEALTH_TOKEN=$(openssl rand -hex 32)" >> .env
#   2. docker compose up -d
#   3. Point a reverse proxy (Caddy, Traefik, nginx) with TLS at :8080,
#      or expose the app directly on a trusted network.
#
# First run: create the admin account with
#   docker compose exec web bin/rails runner 'Agent.create!(email: "you@example.com", name: "You", password: "change-me", role: "admin")'
#
# Everything durable (SQLite databases, attachments, backups) lives in the
# `flow-storage` volume. Back it up, and you have backed up Flow.
services:
  web:
    build: .
    image: flow
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?missing - generate with openssl rand -hex 64 into .env}"
      FLOW_HEALTH_TOKEN: "${FLOW_HEALTH_TOKEN:-}"
      # Uncomment for PostgreSQL instead of the bundled SQLite:
      # DATABASE_URL: postgres://flow:flow@db/flow
      # Optional error tracking:
      # SENTRY_DSN: https://...@sentry.example.com/1
    volumes:
      - flow-storage:/rails/storage
      - flow-plugins:/rails/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  jobs:
    image: flow
    restart: unless-stopped
    command: ./bin/jobs
    environment:
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?missing - generate with openssl rand -hex 64 into .env}"
      # DATABASE_URL: postgres://flow:flow@db/flow
      # SENTRY_DSN: https://...@sentry.example.com/1
    volumes:
      - flow-storage:/rails/storage
      - flow-plugins:/rails/plugins
    depends_on:
      web:
        condition: service_healthy

volumes:
  flow-storage:
  flow-plugins:
